version: 2
updates:
  # Keep GitHub Actions pinned versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# Note: the only remote Swift package is ViewInspector (test target only) and it
# is resolved through the Xcode project, which Dependabot's `swift` ecosystem does
# not track without a root Package.swift. Review it manually with:
#   xcodebuild -resolvePackageDependencies -project CheapSeek.xcodeproj -scheme CheapSeek
