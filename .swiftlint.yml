# SwiftLint configuration — keeps the valuable default rules while matching the
# deliberate style of this codebase. Run locally with `swiftlint lint --strict`.

included:
  - CheapSeek
  - CheapSeekTests
  - CheapSeekUITests

excluded:
  - CheapSeek.xcodeproj
  - Packages
  - build
  - DerivedData

disabled_rules:
  # Trailing commas are allowed (Swift 5.9+) and used throughout.
  - trailing_comma
  # Multiple trailing closures are idiomatic in SwiftUI (e.g. Button(action:label:)).
  - multiple_closures_with_trailing_closure
  # `let _ =` is used deliberately to discard a result.
  - redundant_discardable_let
  # Tests intentionally force-try on values they know are valid fixtures.
  - force_try

function_parameter_count:
  warning: 8
  error: 10

line_length:
  warning: 250
  error: 300

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 40
    error: 60

large_tuple:
  # Test tables use 4-element tuples; keep the rule for anything larger.
  warning: 4
  error: 6

function_body_length:
  warning: 120
  error: 200

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

cyclomatic_complexity:
  warning: 20
  error: 30
