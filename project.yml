name: CheapSeek
options:
  bundleIdPrefix: com.labrus
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      type: debug
    Release:
      type: release

# Localize-Swift 3.2.0 is vendored locally because the upstream SPM target is
# iOS-only (unconditional `import UIKit` in Sources/UI) and does not build on macOS.
packages:
  Localize_Swift:
    path: Packages/Localize-Swift
  # Test-only dependency (MIT). Kept out of the app target so the shipped app
  # stays dependency-free; used to inspect SwiftUI view trees in unit tests.
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: 0.10.0
targets:
  CheapSeek:
    type: application
    platform: macOS
    sources:
      - CheapSeek
    dependencies:
      - package: Localize_Swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labrus.CheapSeek
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: CheapSeek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  CheapSeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CheapSeekTests
    dependencies:
      - target: CheapSeek
      - package: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labrus.CheapSeekTests
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  CheapSeekUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - CheapSeekUITests
    dependencies:
      - target: CheapSeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labrus.CheapSeekUITests
        TEST_TARGET_NAME: CheapSeek
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  CheapSeek:
    build:
      targets:
        CheapSeek: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CheapSeekTests
        - CheapSeekUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
